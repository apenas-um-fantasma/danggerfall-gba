name: Compilar jogo GBA

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          export PATH="$DEVKITARM/bin:/opt/devkitpro/tools/bin:$PATH"
          arm-none-eabi-gcc -mthumb -mthumb-interwork -O2 -Wall -fno-strict-aliasing -specs=gba.specs main.c -o daggerfall.elf -lm
          arm-none-eabi-objcopy -O binary daggerfall.elf daggerfall.gba
          gbafix daggerfall.gba

      - name: Guardar o jogo pronto
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-gba
          path: daggerfall.gba
